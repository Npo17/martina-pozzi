<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>OG image — Martina Pozzi</title>
<!-- Fuente de assets/og.jpg (1200x630). Regenerar con:
     msedge --headless --window-size=1200,630 --screenshot=og.png _src/og.html -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    display: grid; grid-template-columns: 1fr 400px; align-items: center;
    padding: 0 70px; box-sizing: border-box; gap: 50px;
    font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif; color: #fff;
    background: radial-gradient(ellipse 80% 70% at 85% 10%, rgba(217,138,160,.3), transparent 60%), linear-gradient(150deg, #1f0e1c, #3d1a36 45%, #5b2350);
  }
  h1 { margin: 0 0 22px; font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 112px; line-height: .95; letter-spacing: -0.035em; }
  h1 em { font-weight: 500; color: #e9c9a4; }
  p { margin: 0; font-size: 30px; font-weight: 700; line-height: 1.35; color: #f6dfe4; }
  small { display: block; margin-top: 30px; font-size: 24px; font-weight: 500; color: rgba(255,255,255,.7); }
  .photo { height: 500px; border-radius: 400px 400px 28px 28px; overflow: hidden; border: 2px solid rgba(233,201,164,.6); }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; display: block; }
</style>
</head>
<body>
  <div>
    <h1>Martina <em>Pozzi</em></h1>
    <p>Coordinación de servicios en salud<br>Recursos Humanos · Psicología</p>
    <small>martinapozzi.com</small>
  </div>
  <div class="photo"><img src="../assets/profile.jpg" alt=""></div>
</body>
</html>
